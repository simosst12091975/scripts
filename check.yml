---
- name: Bootstrap Python per Ansible su Ubuntu
  hosts: all
  gather_facts: false
  become: false
  vars:
    required_packages:
      - python3
      - python3-apt
      - openssh-server
      - openssh-client
      - curl
      - wget
      - ca-certificates
  tasks:
    - name: Verifica sistema operativo e Python 3
      ansible.builtin.raw: |
        if [ ! -r /etc/os-release ]; then
          echo "Impossibile identificare il sistema: manca /etc/os-release." >&2
          exit 1
        fi
        . /etc/os-release
        if [ "$ID" != "ubuntu" ]; then
          echo "Sistema non supportato: atteso Ubuntu, rilevato $ID ${VERSION_ID:-sconosciuto}." >&2
          exit 1
        fi
        case "${VERSION_ID:-}" in
          24.*|26.*) ;;
          *)
            echo "Versione Ubuntu non supportata: ${VERSION_ID:-sconosciuta}. Attese 24 o 26." >&2
            exit 1
            ;;
        esac
        if command -v python3 >/dev/null 2>&1; then
          echo "INSTALL_RESULT=present"
        else
          echo "Python3 non trovato. Eseguire il playbook come root o installare manualmente python3."
          exit 1
        fi
      register: python_bootstrap
      changed_when: "'INSTALL_RESULT=installed' in python_bootstrap.stdout"

- name: "Verifica server Ubuntu - Flexible Mode (Tutti gli Host)"
  hosts: all
  gather_facts: true
  become: true
  serial: 1
  vars:
    ansible_python_interpreter: /usr/bin/python3
    environment_type: "{{ 'vm' if ansible_facts.virtualization_role == 'guest' else 'bare_metal' }}"
    min_disk_space_gb: 10
    min_memory_mb: 2048
    min_cpu_cores: 2
    report_dir: "/tmp/ansible-checks"

  pre_tasks:
    - name: Determina UID e utente corrente
      ansible.builtin.command: id -u && whoami
      register: current_identity
      changed_when: false

    - name: Imposta variabili di contesto
      ansible.builtin.set_fact:
        current_uid: "{{ current_identity.stdout_lines[0] }}"
        current_user: "{{ current_identity.stdout_lines[1] }}"

    - name: Crea directory per report
      ansible.builtin.file:
        path: "{{ report_dir }}"
        state: directory
        mode: "0755"
      failed_when: false

    - name: Avviso se eseguito senza root
      ansible.builtin.debug:
        msg: >-
          Avviso: il playbook è in esecuzione come {{ current_user }} (UID: {{ current_uid }}).
          Alcune verifiche amministrative e tutte le modifiche di sistema verranno saltate.
          Abilitare l'escalation dei privilegi (become/sudo) nel template o nelle credenziali di Semaphore.
      when: current_uid != "0"

    - name: Conferma esecuzione con root
      ansible.builtin.debug:
        msg: "Esecuzione con privilegi root (UID: 0) - tutte le verifiche saranno eseguite."
      when: current_uid == "0"

  tasks:
    - name: Verifica che il sistema sia Ubuntu 24.04 o 26.04
      ansible.builtin.assert:
        that:
          - ansible_facts.distribution == "Ubuntu"
          - ansible_facts.distribution_version is regex('^(24\\.04|26\\.04)$')
        fail_msg: >-
          Sistema non supportato: {{ ansible_facts.distribution }} {{ ansible_facts.distribution_version }}.
          Questo playbook verifica Ubuntu 24.04 e 26.04.
        success_msg: >-
          Sistema supportato: Ubuntu {{ ansible_facts.distribution_version }}.

    - name: Aggiorna i pacchetti senza cambiare la release di Ubuntu
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
        upgrade: safe
      register: system_update
      become: true

    - name: Verifica che la release Ubuntu sia rimasta invariata
      ansible.builtin.command:
        argv:
          - bash
          - -c
          - '. /etc/os-release && printf "%s %s" "$ID" "$VERSION_ID"'
      register: release_after_update
      changed_when: false

    - name: Conferma che l'aggiornamento non abbia cambiato release
      ansible.builtin.assert:
        that:
          - release_after_update.stdout == "ubuntu " ~ ansible_facts.distribution_version
        fail_msg: >-
          La release del sistema è cambiata inaspettatamente:
          {{ release_after_update.stdout }}.
          Release iniziale: Ubuntu {{ ansible_facts.distribution_version }}.
        success_msg: >-
          Release invariata: Ubuntu {{ ansible_facts.distribution_version }}.

    - name: Mostra il risultato degli aggiornamenti
      ansible.builtin.debug:
        msg: >-
          {{ 'Pacchetti aggiornati.' if system_update.changed else
          'Sistema già aggiornato: nessun pacchetto da aggiornare.' }}

    - name: Verifica aggiornamenti kernel
      ansible.builtin.command:
        argv:
          - apt
          - list
          - --upgradable
      register: kernel_updates
      changed_when: false
      failed_when: false

    - name: Avviso aggiornamenti kernel disponibili
      ansible.builtin.debug:
        msg: >-
          Restano aggiornamenti kernel dopo l'aggiornamento dei pacchetti.
          Potrebbe essere necessario riavviare il server per applicarli.
      when: "'linux-image' in kernel_updates.stdout"

    - name: Raccoglie i pacchetti installati
      ansible.builtin.package_facts:
        manager: auto
      register: package_facts
      failed_when: false

    - name: Verifica pacchetti essenziali
      ansible.builtin.assert:
        that:
          - item in ansible_facts.packages
        fail_msg: "Pacchetto non presente: {{ item }}"
        success_msg: "Pacchetto presente: {{ item }}"
      loop: "{{ required_packages }}"
      when: package_facts is defined and package_facts.succeeded | default(false)
      ignore_errors: true
      register: package_check

    - name: Installazione pacchetti essenziali (solo root)
      ansible.builtin.apt:
        name: "{{ item }}"
        state: present
        update_cache: true
      loop: "{{ required_packages }}"
      when:
        - current_uid == "0"
        - package_facts is defined
        - item not in ansible_facts.packages
      register: package_install
      ignore_errors: true
      become: true

    - name: Conferma installazione pacchetti
      ansible.builtin.debug:
        msg: "Pacchetti essenziali verificati/installati"
      when: current_uid == "0" and package_install is defined

    - name: Raccoglie lo stato dei servizi
      ansible.builtin.service_facts:
      register: service_facts
      failed_when: false

    - name: Verifica che il servizio SSH sia presente e attivo
      ansible.builtin.assert:
        that:
          - "'ssh.service' in ansible_facts.services or 'ssh' in ansible_facts.services"
          - ansible_facts.services['ssh.service' if 'ssh.service' in ansible_facts.services else 'ssh'].state == "running"
        fail_msg: >-
          SSH non è in esecuzione o non è stato rilevato.
        success_msg: >-
          SSH è in esecuzione.
      when: service_facts is defined and service_facts.succeeded | default(false)
      ignore_errors: true

    - name: Verifica porta SSH in ascolto
      ansible.builtin.command: ss -tlnp 2>/dev/null | grep ":22 " || echo "ssh_check_skipped"
      register: ssh_listen
      changed_when: false
      failed_when: false

    - name: Conferma SSH in ascolto
      ansible.builtin.debug:
        msg: "SSH in ascolto sulla porta 22"
      when: ssh_listen.rc == 0 and ssh_listen.stdout != "ssh_check_skipped"

    - name: Verifica file SSH config e permessi (solo root)
      ansible.builtin.stat:
        path: /etc/ssh/sshd_config
      register: sshd_config
      when: current_uid == "0"

    - name: Controllo hardening SSH - Permessi (solo root)
      ansible.builtin.assert:
        that:
          - sshd_config.stat.exists
          - sshd_config.stat.mode == "0600"
        fail_msg: >-
          Permessi non corretti per /etc/ssh/sshd_config.
        success_msg: >-
          Permessi sshd_config corretti.
      when:
        - current_uid == "0"
        - sshd_config is defined
      ignore_errors: true

    - name: "Applica hardening SSH - Configurazione (solo root)"
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
        state: present
        validate: '/usr/sbin/sshd -t -f %s'
      loop:
        - { regexp: '^#?PermitRootLogin', line: 'PermitRootLogin prohibit-password' }
        - { regexp: '^#?PubkeyAuthentication', line: 'PubkeyAuthentication yes' }
        - { regexp: '^#?PasswordAuthentication', line: 'PasswordAuthentication no' }
        - { regexp: '^#?X11Forwarding', line: 'X11Forwarding no' }
        - { regexp: '^#?MaxAuthTries', line: 'MaxAuthTries 3' }
        - { regexp: '^#?ClientAliveInterval', line: 'ClientAliveInterval 300' }
        - { regexp: '^#?ClientAliveCountMax', line: 'ClientAliveCountMax 2' }
      when: current_uid == "0"
      register: ssh_hardening
      ignore_errors: true
      become: true
      notify: Restart SSH

    - name: Conferma hardening SSH applicato
      ansible.builtin.debug:
        msg: "SSH hardening applicato"
      when: current_uid == "0" and ssh_hardening is defined

    - name: Verifica firewall UFW (solo root)
      ansible.builtin.command: ufw status
      register: ufw_status
      changed_when: false
      failed_when: false
      when: current_uid == "0"
      become: true

    - name: "Configura firewall - Abilita UFW (solo root)"
      ansible.builtin.command: ufw --force enable
      register: ufw_enable
      when:
        - current_uid == "0"
        - "'Status: inactive' in ufw_status.stdout"
      ignore_errors: true
      become: true

    - name: "Configura firewall - Consenti SSH (solo root)"
      ansible.builtin.command: ufw allow 22/tcp
      register: ufw_ssh
      when: current_uid == "0"
      ignore_errors: true
      become: true

    - name: Avviso firewall se non-root
      ansible.builtin.debug:
        msg: "Verifica firewall saltata: il playbook non è in esecuzione come root."
      when: current_uid != "0"

    - name: Conferma firewall configurato
      ansible.builtin.debug:
        msg: "Firewall configurato"
      when: current_uid == "0" and ufw_status.rc == 0

    - name: Verifica memoria RAM (minimo richiesto)
      ansible.builtin.assert:
        that:
          - (ansible_facts.memtotal_mb | int) >= min_memory_mb
        fail_msg: >-
          Memoria insufficiente: {{ ansible_facts.memtotal_mb }} MB. Minimo richiesto: {{ min_memory_mb }} MB.
        success_msg: >-
          Memoria RAM: {{ (ansible_facts.memtotal_mb | int / 1024) | round(1) }} GB.

    - name: Verifica numero CPU (minimo richiesto)
      ansible.builtin.assert:
        that:
          - (ansible_facts.processor_vcpus | int) >= min_cpu_cores
        fail_msg: >-
          CPU insufficiente: {{ ansible_facts.processor_vcpus }}. Minimo richiesto: {{ min_cpu_cores }} vCPU.
        success_msg: >-
          CPU: {{ ansible_facts.processor_vcpus }} vCPU.

    - name: Verifica spazio disco root (minimo richiesto)
      ansible.builtin.assert:
        that:
          - (ansible_facts.mounts | selectattr('mount', 'equalto', '/') | first)['size_available'] / 1073741824 | int >= min_disk_space_gb
        fail_msg: >-
          Spazio disco insufficiente in root: {{ (ansible_facts.mounts | selectattr('mount', 'equalto', '/') | first)['size_available'] / 1073741824 | round(1) }} GB disponibili. Minimo richiesto: {{ min_disk_space_gb }} GB.
        success_msg: >-
          Spazio disco disponibile: {{ (ansible_facts.mounts | selectattr('mount', 'equalto', '/') | first)['size_available'] / 1073741824 | round(1) }} GB.

    - name: Verifica DNS
      ansible.builtin.command: getent hosts google.com
      register: dns_check
      changed_when: false
      failed_when: false

    - name: Conferma DNS funzionante
      ansible.builtin.debug:
        msg: "DNS: OK"
      when: dns_check.rc == 0

    - name: Verifica connettività esterna
      ansible.builtin.uri:
        url: "https://www.google.com"
        method: HEAD
        status_code: [200, 301, 302]
        timeout: 5
      register: external_connectivity
      changed_when: false
      failed_when: false
      ignore_errors: true

    - name: Conferma connettività esterna
      ansible.builtin.debug:
        msg: "Connettività esterna: OK"
      when: external_connectivity.status is defined and external_connectivity.status in [200, 301, 302]

    - name: Visualizza tipo ambiente
      ansible.builtin.debug:
        msg: >-
          Ambiente: {{ environment_type | upper }}
          Virtualizzazione: {{ ansible_facts.virtualization_type | default('N/A') }}
          Role: {{ ansible_facts.virtualization_role | default('host') }}

    - name: Verifica supporto CPU virtualizzazione (se bare metal)
      ansible.builtin.command: grep -E "(vmx|svm)" /proc/cpuinfo
      register: cpu_virt
      changed_when: false
      failed_when: false
      when: environment_type == 'bare_metal'

    - name: Conferma supporto CPU virtualizzazione
      ansible.builtin.debug:
        msg: "CPU supporta virtualizzazione"
      when:
        - environment_type == 'bare_metal'
        - cpu_virt.rc == 0

    - name: Verifica errori del kernel
      ansible.builtin.command: dmesg | tail -20 | grep -i error || echo "no_errors"
      register: kernel_errors
      changed_when: false
      failed_when: false

    - name: Mostra stato errori kernel
      ansible.builtin.debug:
        msg: "Kernel errors: {{ 'NONE' if kernel_errors.stdout == 'no_errors' else 'PRESENT' }}"

    - name: Verifica errori sistema (journalctl)
      ansible.builtin.command: journalctl -p err -n 5 --no-pager 2>/dev/null || echo "journalctl_unavailable"
      register: system_errors
      changed_when: false
      failed_when: false

    - name: Mostra stato errori sistema
      ansible.builtin.debug:
        msg: "Journal errors: {{ 'NONE' if system_errors.stdout | length < 5 or 'unavailable' in system_errors.stdout else 'PRESENT' }}"

    - name: Genera riepilogo finale
      ansible.builtin.debug:
        msg:
          - "================================================================================"
          - "                              HEALTH CHECK REPORT"
          - "================================================================================"
          - "Host: {{ inventory_hostname }} ({{ ansible_facts.hostname }})"
          - "FQDN: {{ ansible_facts.fqdn }}"
          - "Utente esecuzione: {{ current_user }} (UID: {{ current_uid }})"
          - "Sistema: {{ ansible_facts.distribution }} {{ ansible_facts.distribution_version }}"
          - "Kernel: {{ ansible_facts.kernel }} ({{ ansible_facts.architecture }})"
          - "Ambiente: {{ environment_type | upper }}"
          - ""
          - "HARDWARE:"
          - "  CPU: {{ ansible_facts.processor_vcpus }} vCPU"
          - "  RAM: {{ (ansible_facts.memtotal_mb | int / 1024) | round(1) }} GB"
          - "  Disco root libero: {{ (ansible_facts.mounts | selectattr('mount', 'equalto', '/') | first)['size_available'] / 1073741824 | round(1) }} GB"
          - ""
          - "SERVIZI:"
          - "  SSH: attivo"
          - "  Python: disponibile"
          - "{{ '  Firewall: configurato' if current_uid == '0' else '  Firewall: non verificato (non-root)' }}"
          - ""
          - "PRIVILEGI:"
          - "  Root: {{ 'YES' if current_uid == '0' else 'NO (Modalità Limited)' }}"
          - ""
          - "================================================================================"
          - "STATUS: ✓ OK - SISTEMA PRONTO PER ANSIBLE"
          - "================================================================================"

    - name: Salva report JSON
      ansible.builtin.copy:
        content: "{{ {
          'host': inventory_hostname,
          'hostname': ansible_facts.hostname,
          'fqdn': ansible_facts.fqdn,
          'user': current_user,
          'uid': current_uid,
          'is_root': current_uid == '0',
          'os': ansible_facts.distribution ~ ' ' ~ ansible_facts.distribution_version,
          'kernel': ansible_facts.kernel,
          'architecture': ansible_facts.architecture,
          'environment': environment_type,
          'cpu_vcpu': ansible_facts.processor_vcpus,
          'ram_gb': (ansible_facts.memtotal_mb | int / 1024) | round(1),
          'disk_free_gb': (ansible_facts.mounts | selectattr('mount', 'equalto', '/') | first)['size_available'] / 1073741824 | round(1),
          'ssh_status': 'running',
          'python_available': true,
          'status': 'OK'
        } | to_nice_json }}"
        dest: "{{ report_dir }}/check-{{ inventory_hostname }}.json"
        mode: "0644"
      failed_when: false

  handlers:
    - name: Restart SSH
      ansible.builtin.systemd:
        name: ssh
        state: restarted
        enabled: true
      when: current_uid == "0"
      ignore_errors: true

  post_tasks:
    - name: Mostra posizione report JSON
      ansible.builtin.debug:
        msg: |
          Report JSON salvato in: {{ report_dir }}/check-{{ inventory_hostname }}.json
