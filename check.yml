---
- name: Verifica salute Linux, FreeBSD e OPNsense (sola lettura)
  hosts: all
  gather_facts: true
  become: false
  serial: 1
  vars:
    ansible_python_interpreter: auto_silent
    min_disk_space_gb: 10
    min_memory_mb: 2048
    min_cpu_cores: 2
    ssh_port: 22
    healthcheck_dns_name: example.com
    healthcheck_url: https://example.com/
    package_requirements:
      Debian:
        - python3
        - openssh-server
        - openssh-client
        - curl
        - wget
        - ca-certificates
      RedHat:
        - python3
        - openssh-server
        - openssh-clients
        - curl
        - wget
        - ca-certificates
    container_virtualization_types:
      - container
      - containerd
      - docker
      - freebsd_jail
      - jail
      - lxc
      - lxc-libvirt
      - openvz
      - podman
      - systemd-nspawn

  pre_tasks:
    - name: Verifica le famiglie di sistemi supportate
      ansible.builtin.assert:
        that:
          - ansible_facts.os_family in ['Debian', 'RedHat', 'FreeBSD']
          - >-
            ansible_facts.os_family == 'FreeBSD'
            or ansible_facts.pkg_mgr | default('') in ['apt', 'dnf', 'yum']
        fail_msg: >-
          Sistema non supportato:
          {{ ansible_facts.distribution | default('sconosciuto') }}
          (famiglia {{ ansible_facts.os_family | default('sconosciuta') }}).
          Supportati Linux Debian/apt, RedHat/dnf o yum, FreeBSD e OPNsense.

    - name: Determina l'utente e i privilegi della connessione
      ansible.builtin.command:
        argv:
          - sh
          - -c
          - 'printf "%s\n%s" "$(id -u)" "$(id -un)"'
      register: connection_identity
      changed_when: false

    - name: Rileva il kernel effettivo
      ansible.builtin.command:
        argv:
          - uname
          - -s
      register: detected_kernel
      changed_when: false

    - name: Rileva il comando versione OPNsense su FreeBSD
      ansible.builtin.command:
        argv:
          - opnsense-version
      register: opnsense_version
      changed_when: false
      failed_when: false
      when: ansible_facts.os_family == 'FreeBSD'

    - name: Classifica il sistema e rileva le risorse
      ansible.builtin.set_fact:
        current_uid: "{{ connection_identity.stdout_lines[0] }}"
        current_user: "{{ connection_identity.stdout_lines[1] }}"
        is_freebsd_like: "{{ ansible_facts.os_family == 'FreeBSD' }}"
        is_opnsense: >-
          {{
            ansible_facts.distribution | lower == 'opnsense'
            or (
              ansible_facts.os_family == 'FreeBSD'
              and opnsense_version.rc | default(1) == 0
            )
          }}
        environment_type: >-
          {{
            'container'
            if (ansible_facts.virtualization_type | default('unknown') | lower)
               in container_virtualization_types
            else (
              'virtual_machine'
              if (
                ansible_facts.virtualization_role | default('host') == 'guest'
                or (
                  ansible_facts.virtualization_type
                  | default('unknown') | lower
                ) not in ['', 'unknown', 'na', 'none', 'physical']
              )
              else 'bare_metal'
            )
          }}
        root_mounts: >-
          {{
            ansible_facts.mounts | default([])
            | selectattr('mount', 'equalto', '/') | list
          }}
        cpu_cores: >-
          {{
            ansible_facts.processor_vcpus
            | default(ansible_facts.processor_count | default(0)) | int
          }}

    - name: Calcola controlli risorse e requisiti pacchetti
      ansible.builtin.set_fact:
        root_mount: "{{ root_mounts | first | default({}) }}"
        required_packages: >-
          {{
            package_requirements.get(ansible_facts.os_family, [])
            | reject(
                'in',
                ['openssh-server', 'openssh-client', 'openssh-clients']
              )
            | list
            if environment_type == 'container'
            else package_requirements.get(ansible_facts.os_family, [])
          }}
        package_check_applicable: >-
          {{ ansible_facts.os_family in ['Debian', 'RedHat'] }}
        memory_ok: >-
          {{
            (ansible_facts.memtotal_mb | default(0) | int)
            >= (min_memory_mb | int)
          }}
        cpu_ok: "{{ (cpu_cores | int) >= (min_cpu_cores | int) }}"
        disk_ok: >-
          {{
            (root_mounts | first | default({})).get('size_available', 0) | int
            >= ((min_disk_space_gb | int) * 1073741824)
          }}

    - name: Verifica che OPNsense sia rilevato come sistema FreeBSD-like
      ansible.builtin.assert:
        that:
          - not (is_opnsense | bool) or is_freebsd_like | bool
          - >-
            not (is_opnsense | bool)
            or detected_kernel.stdout | lower == 'freebsd'
        fail_msg: >-
          OPNsense è stato identificato ma i facts non riportano un kernel
          FreeBSD. Rilevati: famiglia {{ ansible_facts.os_family }},
          kernel {{ detected_kernel.stdout | default('sconosciuto') }}.
        success_msg: >-
          OPNsense rilevato su kernel FreeBSD
          ({{
            opnsense_version.stdout
            | default('versione non rilevata') | trim
          }}).
      when: is_opnsense | bool

    - name: Raccoglie i pacchetti installati sui sistemi Linux
      ansible.builtin.package_facts:
        manager: auto
      register: installed_package_facts
      failed_when: false
      when: ansible_facts.os_family in ['Debian', 'RedHat']

    - name: Raccoglie i servizi sui sistemi Linux
      ansible.builtin.service_facts:
      register: detected_service_facts
      failed_when: false
      when: ansible_facts.os_family in ['Debian', 'RedHat']

    - name: Determina il nome del servizio SSH
      ansible.builtin.set_fact:
        ssh_service_name: >-
          {{
            'sshd' if is_freebsd_like | bool
            else 'ssh.service'
            if 'ssh.service' in (ansible_facts.services | default({}))
            else 'ssh' if 'ssh' in (ansible_facts.services | default({}))
            else 'sshd.service'
            if 'sshd.service' in (ansible_facts.services | default({}))
            else 'sshd' if 'sshd' in (ansible_facts.services | default({}))
            else ''
          }}
        package_facts_available: >-
          {{
            not (package_check_applicable | bool)
            or not (installed_package_facts.failed | default(false))
          }}
        missing_required_packages: >-
          {{
            required_packages
            | reject('in', ansible_facts.packages | default({}))
            | list
          }}

  tasks:
    - name: Mostra identità e piattaforma
      ansible.builtin.debug:
        msg:
          - >-
            Host: {{ inventory_hostname }}
            ({{ ansible_facts.hostname | default('N/D') }})
          - >-
            Sistema: {{ ansible_facts.distribution | default('N/D') }}
            {{ ansible_facts.distribution_version | default('') }}
          - >-
            Kernel/famiglia: {{ ansible_facts.kernel | default('N/D') }}
            / {{ ansible_facts.os_family }}
          - >-
            Piattaforma:
            {{
              'OPNsense basato su FreeBSD'
              if is_opnsense | bool
              else 'FreeBSD'
              if is_freebsd_like | bool
              else 'Linux'
            }}
          - >-
            Package manager:
            {{ ansible_facts.pkg_mgr | default('pkg (FreeBSD)') }}
          - >-
            Ambiente: {{ environment_type }} —
            {{ ansible_facts.virtualization_type | default('non rilevato') }}
          - "Connessione: {{ current_user }} (UID {{ current_uid }})"

    - name: Riporta il controllo RAM
      ansible.builtin.debug:
        msg: >-
          RAM: {{ ansible_facts.memtotal_mb | default(0) }} MB;
          minimo: {{ min_memory_mb }} MB;
          esito: {{ 'OK' if memory_ok | bool else 'ATTENZIONE' }}.

    - name: Riporta il controllo CPU
      ansible.builtin.debug:
        msg: >-
          CPU/vCPU: {{ cpu_cores }};
          minimo: {{ min_cpu_cores }};
          esito: {{ 'OK' if cpu_ok | bool else 'ATTENZIONE' }}.

    - name: Riporta lo spazio libero sulla root
      ansible.builtin.debug:
        msg: >-
          Spazio root libero:
          {{
            ((root_mount.get('size_available', 0) | int) / 1073741824)
            | round(1)
          }} GB;
          minimo: {{ min_disk_space_gb }} GB;
          esito: {{ 'OK' if disk_ok | bool else 'ATTENZIONE' }}.

    - name: Riporta il controllo pacchetti Linux
      ansible.builtin.debug:
        msg: >-
          {{
            'Controllo pacchetti non applicabile su FreeBSD/OPNsense.'
            if not package_check_applicable | bool
            else (
              'Pacchetti mancanti: ' ~ (missing_required_packages | join(', '))
              if package_facts_available | bool
                 and missing_required_packages | length > 0
              else (
                'Pacchetti richiesti presenti.'
                if package_facts_available | bool
                else 'Verifica pacchetti non disponibile.'
              )
            )
          }}

    - name: Riporta lo stato del servizio SSH Linux
      ansible.builtin.debug:
        msg: >-
          {{
            'Servizio SSH (' ~ ssh_service_name ~ '): '
            ~ (ansible_facts.services | default({}))[ssh_service_name].state
            if ssh_service_name | length > 0
            else 'Servizio SSH non rilevato.'
          }}
      when: not is_freebsd_like | bool

    - name: Verifica lo stato di sshd su FreeBSD e OPNsense
      ansible.builtin.command:
        argv:
          - service
          - sshd
          - onestatus
      register: freebsd_ssh_status
      changed_when: false
      failed_when: false
      when: is_freebsd_like | bool

    - name: Riporta lo stato di sshd su FreeBSD e OPNsense
      ansible.builtin.debug:
        msg: >-
          Servizio sshd:
          {{
            'attivo'
            if freebsd_ssh_status.rc == 0
            else 'non attivo o stato non rilevabile'
          }}.
      when: is_freebsd_like | bool

    - name: Verifica la porta SSH in ascolto
      ansible.builtin.command:
        argv: >-
          {{
            ['sockstat', '-46', '-l', '-P', 'tcp', '-p', ssh_port | string]
            if is_freebsd_like | bool
            else ['ss', '-H', '-ltn', 'sport', '=', ':' ~ (ssh_port | string)]
          }}
      register: ssh_listen
      changed_when: false
      failed_when: false

    - name: Riporta il controllo della porta SSH
      ansible.builtin.debug:
        msg: >-
          {{
            'Listener rilevati: ' ~ (ssh_listen.stdout | trim)
            if ssh_listen.rc == 0 and ssh_listen.stdout | trim | length > 0
            else 'Nessun listener o strumento di controllo non disponibile.'
          }}

    - name: Verifica la presenza della configurazione SSH
      ansible.builtin.stat:
        path: /etc/ssh/sshd_config
      register: sshd_config

    - name: Riporta la configurazione SSH
      ansible.builtin.debug:
        msg: >-
          {{
            'sshd_config presente, permessi '
            ~ (sshd_config.stat.mode | default('non rilevati')) ~ '.'
            if sshd_config.stat.exists
            else 'File /etc/ssh/sshd_config non presente.'
          }}

    - name: Verifica UFW sui sistemi Linux
      ansible.builtin.command:
        argv:
          - ufw
          - status
      register: ufw_status
      changed_when: false
      failed_when: false
      when: ansible_facts.os_family in ['Debian', 'RedHat']

    - name: Verifica firewalld sui sistemi Linux
      ansible.builtin.command:
        argv:
          - firewall-cmd
          - --state
      register: firewalld_status
      changed_when: false
      failed_when: false
      when: ansible_facts.os_family in ['Debian', 'RedHat']

    - name: Verifica PF su FreeBSD e OPNsense
      ansible.builtin.command:
        argv:
          - pfctl
          - -s
          - info
      register: pf_status
      changed_when: false
      failed_when: false
      when: is_freebsd_like | bool

    - name: Riporta gli stati dei firewall
      ansible.builtin.debug:
        msg:
          - >-
            UFW: {{
              ufw_status.stdout | trim
              if ansible_facts.os_family in ['Debian', 'RedHat']
                 and ufw_status.rc == 0
              else (
                'non disponibile'
                if ansible_facts.os_family in ['Debian', 'RedHat']
                else 'non applicabile'
              )
            }}
          - >-
            firewalld: {{
              firewalld_status.stdout | trim
              if ansible_facts.os_family in ['Debian', 'RedHat']
                 and firewalld_status.rc == 0
              else (
                'non disponibile'
                if ansible_facts.os_family in ['Debian', 'RedHat']
                else 'non applicabile'
              )
            }}
          - >-
            PF: {{
              pf_status.stdout | trim
              if is_freebsd_like | bool and pf_status.rc == 0
              else (
                'non disponibile'
                if is_freebsd_like | bool
                else 'non applicabile'
              )
            }}

    - name: Verifica la risoluzione DNS
      ansible.builtin.command:
        argv:
          - getent
          - hosts
          - "{{ healthcheck_dns_name }}"
      register: dns_check
      changed_when: false
      failed_when: false

    - name: Riporta il controllo DNS
      ansible.builtin.debug:
        msg: >-
          DNS {{ healthcheck_dns_name }}:
          {{ 'OK' if dns_check.rc == 0 else 'non risolto o non disponibile' }}.

    - name: Verifica la connettività HTTPS
      ansible.builtin.uri:
        url: "{{ healthcheck_url }}"
        method: HEAD
        status_code: [200, 301, 302, 403, 405]
        timeout: 10
      register: external_connectivity
      changed_when: false
      failed_when: false

    - name: Riporta il controllo HTTPS
      ansible.builtin.debug:
        msg: >-
          HTTPS {{ healthcheck_url }}:
          {{
            'OK (HTTP ' ~ (external_connectivity.status | string) ~ ')'
            if external_connectivity.status is defined
            else 'non disponibile: '
              ~ (external_connectivity.msg | default('errore di rete'))
          }}.

    - name: Verifica i flag CPU di virtualizzazione su bare metal Linux
      ansible.builtin.command:
        argv:
          - grep
          - -E
          - "(vmx|svm)"
          - /proc/cpuinfo
      register: cpu_virtualization
      changed_when: false
      failed_when: false
      when:
        - environment_type == 'bare_metal'
        - not is_freebsd_like | bool

    - name: Riporta il supporto CPU alla virtualizzazione
      ansible.builtin.debug:
        msg: >-
          {{
            'Flag di virtualizzazione Intel/AMD rilevati.'
            if cpu_virtualization.rc == 0
            else 'Flag non rilevati o architettura non x86.'
          }}
      when:
        - environment_type == 'bare_metal'
        - not is_freebsd_like | bool

    - name: Legge i messaggi del kernel
      ansible.builtin.command:
        argv:
          - dmesg
      register: kernel_messages
      changed_when: false
      failed_when: false

    - name: Riporta gli errori del kernel
      ansible.builtin.debug:
        msg: >-
          {{
            'Messaggi kernel con errori: '
            ~ (
              (kernel_messages.stdout_lines | default([]))[-20:]
              | select('search', '(?i)error')
              | list | join('\n')
            )
            if (
              (kernel_messages.stdout_lines | default([]))[-20:]
              | select('search', '(?i)error') | list | length > 0
            )
            else 'Nessun errore rilevato o dmesg non accessibile.'
          }}

    - name: Verifica gli ultimi errori del journal Linux
      ansible.builtin.command:
        argv:
          - journalctl
          - -p
          - err
          - -n
          - "5"
          - --no-pager
      register: linux_system_errors
      changed_when: false
      failed_when: false
      when: not is_freebsd_like | bool

    - name: Verifica gli ultimi messaggi syslog FreeBSD e OPNsense
      ansible.builtin.command:
        argv:
          - tail
          - -n
          - "5"
          - /var/log/messages
      register: freebsd_system_errors
      changed_when: false
      failed_when: false
      when: is_freebsd_like | bool

    - name: Riporta gli ultimi messaggi di sistema
      ansible.builtin.debug:
        msg: >-
          {{
            'Journal: ' ~ (linux_system_errors.stdout | trim)
            if not is_freebsd_like | bool
               and linux_system_errors.rc == 0
               and linux_system_errors.stdout | trim | length > 0
            else (
              'Syslog: ' ~ (freebsd_system_errors.stdout | trim)
              if is_freebsd_like | bool
                 and freebsd_system_errors.rc == 0
                 and freebsd_system_errors.stdout | trim | length > 0
              else 'Journal/syslog non disponibile o nessun messaggio recente.'
            )
          }}

    - name: Mostra il report JSON in output senza salvarlo sull'host
      ansible.builtin.debug:
        msg: >-
          {{
            {
              'host': inventory_hostname,
              'hostname': ansible_facts.hostname | default(''),
              'distribution': ansible_facts.distribution | default(''),
              'distribution_version':
                ansible_facts.distribution_version | default(''),
              'os_family': ansible_facts.os_family,
              'kernel': ansible_facts.kernel | default(''),
              'kernel_name': detected_kernel.stdout | default(''),
              'is_freebsd_like': is_freebsd_like | bool,
              'is_opnsense': is_opnsense | bool,
              'opnsense_version':
                opnsense_version.stdout | default('') | trim,
              'environment': environment_type,
              'cpu_cores': cpu_cores,
              'cpu_ok': cpu_ok | bool,
              'memory_mb': ansible_facts.memtotal_mb | default(0),
              'memory_ok': memory_ok | bool,
              'disk_free_gb':
                ((root_mount.get('size_available', 0) | int) / 1073741824)
                | round(1),
              'disk_ok': disk_ok | bool,
              'package_check_applicable': package_check_applicable | bool,
              'package_facts_available': package_facts_available | bool,
              'missing_required_packages': missing_required_packages,
              'ssh_service': ssh_service_name,
              'ssh_port_listening':
                ssh_listen.rc == 0 and ssh_listen.stdout | trim | length > 0,
              'dns_ok': dns_check.rc == 0,
              'https_status':
                external_connectivity.status | default('unavailable'),
              'status': 'OK' if (
                memory_ok | bool
                and cpu_ok | bool
                and disk_ok | bool
                and (
                  not package_check_applicable | bool
                  or (
                    package_facts_available | bool
                    and missing_required_packages | length == 0
                  )
                )
              ) else 'WARNING'
            } | to_nice_json
          }}
