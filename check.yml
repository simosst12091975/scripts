---
- name: Bootstrap Python per Ansible su Ubuntu
  hosts: laboratorio_ai
  gather_facts: false
  become: false
  vars:
    required_packages:
      - python3
      - python3-apt
      - openssh-server
      - openssh-client
      - curl
      - wget
      - ca-certificates
  tasks:
    - name: Verifica sistema operativo e Python 3
      ansible.builtin.raw: |
        if [ ! -r /etc/os-release ]; then
          echo "Impossibile identificare il sistema: manca /etc/os-release." >&2
          exit 1
        fi
        . /etc/os-release
        if [ "$ID" != "ubuntu" ]; then
          echo "Sistema non supportato: atteso Ubuntu, rilevato $ID ${VERSION_ID:-sconosciuto}." >&2
          exit 1
        fi
        case "${VERSION_ID:-}" in
          24.*|26.*) ;;
          *)
            echo "Versione Ubuntu non supportata: ${VERSION_ID:-sconosciuta}. Attese 24 o 26." >&2
            exit 1
            ;;
        esac
        if command -v python3 >/dev/null 2>&1; then
          echo "INSTALL_RESULT=present"
        else
          echo "Python3 non trovato. Eseguire il playbook come root o installare manualmente python3."
          exit 1
        fi
      register: python_bootstrap
      changed_when: "'INSTALL_RESULT=installed' in python_bootstrap.stdout"

- name: "Verifica server Ubuntu - Flexible Mode"
  hosts: laboratorio_ai
  gather_facts: true
  become: false
  serial: 1
  vars:
    environment_type: "{{ 'vm' if ansible_facts.virtualization_role == 'guest' else 'bare_metal' }}"
    min_disk_space_gb: 10
    min_memory_mb: 2048
    min_cpu_cores: 2
    report_dir: "/tmp/ansible-checks"

  pre_tasks:
    - name: Determina UID e utente corrente
      ansible.builtin.command: id -u && whoami
      register: current_identity
      changed_when: false
      failed_when: false

    - name: Imposta variabili di contesto
      ansible.builtin.set_fact:
        current_uid: "{{ current_identity.stdout_lines[0] | default('unknown') }}"
        current_user: "{{ current_identity.stdout_lines[1] | default('unknown') }}"

    - name: Crea directory per report
      ansible.builtin.file:
        path: "{{ report_dir }}"
        state: directory
        mode: "0755"
      failed_when: false

    - name: Avviso se eseguito senza root
      ansible.builtin.debug:
        msg: >-
          Avviso: il playbook è in esecuzione come {{ current_user }} (UID: {{ current_uid }}).
          Alcune verifiche amministrative e tutte le modifiche di sistema verranno saltate.
          Per esecuzione completa usare: sudo ansible-playbook -b check.yml
      when: current_uid != "0"

  tasks:
    - name: Verifica che il sistema sia Ubuntu 24.04 o 26.04
      ansible.builtin.assert:
        that:
          - ansible_facts.distribution == "Ubuntu"
          - ansible_facts.distribution_version is regex('^(24\\.04|26\\.04)$')
        fail_msg: >-
          Sistema non supportato: {{ ansible_facts.distribution }} {{ ansible_facts.distribution_version }}.
          Questo playbook verifica Ubuntu 24.04 e 26.04.
        success_msg: >-
          Sistema supportato: Ubuntu {{ ansible_facts.distribution_version }}.

    - name: Verifica aggiornamenti kernel
      ansible.builtin.command: apt list --upgradable 2>/dev/null | grep -i linux-image || echo "kernel_updated"
      register: kernel_updates
      changed_when: false
      failed_when: false

    - name: Avviso aggiornamenti kernel
      ansible.builtin.debug:
        msg: >-
          Aggiornamenti kernel disponibili. Eseguire: sudo apt update && sudo apt upgrade linux-image-*
      when: "'linux-image' in kernel_updates.stdout"

    - name: Raccoglie i pacchetti installati
      ansible.builtin.package_facts:
        manager: auto
      register: package_facts
      failed_when: false

    - name: Verifica pacchetti essenziali
      ansible.builtin.assert:
        that:
          - item in ansible_facts.packages
        fail_msg: "Pacchetto non presente: {{ item }}"
        success_msg: "Pacchetto presente: {{ item }}"
      loop: "{{ required_packages }}"
      when: package_facts is defined and package_facts.succeeded | default(false)
      ignore_errors: true
      register: package_check

    - name: Installazione pacchetti essenziali (solo root)
      ansible.builtin.apt:
        name: "{{ item }}"
        state: present
        update_cache: true
      loop: "{{ required_packages }}"
      when:
        - current_uid == "0"
        - package_facts is defined
        - item not in ansible_facts.packages
      register: package_install
      ignore_errors: true

    - name: Raccoglie lo stato dei servizi
      ansible.builtin.service_facts:
      register: service_facts
      failed_when: false

    - name: Verifica che il servizio SSH sia presente e attivo
      ansible.builtin.assert:
        that:
          - "'ssh.service' in ansible_facts.services or 'ssh' in ansible_facts.services"
          - ansible_facts.services['ssh.service' if 'ssh.service' in ansible_facts.services else 'ssh'].state == "running"
        fail_msg: >-
          SSH non è in esecuzione o non è stato rilevato.
        success_msg: >-
          SSH in esecuzione.
      when: service_facts is defined and service_facts.succeeded | default(false)
      ignore_errors: true

    - name: Verifica porta SSH in ascolto
      ansible.builtin.command: ss -tlnp 2>/dev/null | grep ":22 " || echo "ssh_check_skipped"
      register: ssh_listen
      changed_when: false
      failed_when: false

    - name: Mostra stato porta SSH
      ansible.builtin.debug:
        msg: "SSH in ascolto sulla porta 22"
      when: ssh_listen.rc == 0 and ssh_listen.stdout != "ssh_check_skipped"

    - name: Verifica file SSH config (solo root)
      ansible.builtin.stat:
        path: /etc/ssh/sshd_config
      register: sshd_config
      when: current_uid == "0"

    - name: Controllo hardening SSH (solo root)
      ansible.builtin.assert:
        that:
          - sshd_config.stat.exists
          - sshd_config.stat.mode == "0600"
        fail_msg: >-
          Permessi non corretti per /etc/ssh/sshd_config.
        success_msg: >-
          Permessi sshd_config corretti.
      when:
        - current_uid == "0"
        - sshd_config is defined
      ignore_errors: true

    - name: Verifica firewall e hardening (solo root)
      ansible.builtin.command: ufw status || echo "ufw_not_installed"
      register: ufw_status
      changed_when: false
      failed_when: false
      when: current_uid == "0"

    - name: Avviso firewall se non-root
      ansible.builtin.debug:
        msg: "Verifica firewall saltata: il playbook non è in esecuzione come root."
      when: current_uid != "0"

    - name: Verifica memoria RAM
      ansible.builtin.assert:
        that:
          - (ansible_facts.memtotal_mb | int) >= min_memory_mb
        fail_msg: >-
          Memoria insufficiente: {{ ansible_facts.memtotal_mb }} MB. Minimo richiesto: {{ min_memory_mb }} MB.
        success_msg: >-
          Memoria RAM: {{ (ansible_facts.memtotal_mb | int / 1024) | round(1) }} GB.

    - name: Verifica numero CPU
      ansible.builtin.assert:
        that:
          - (ansible_facts.processor_vcpus | int) >= min_cpu_cores
        fail_msg: >-
          CPU insufficiente: {{ ansible_facts.processor_vcpus }}. Minimo richiesto: {{ min_cpu_cores }} vCPU.
        success_msg: >-
          CPU: {{ ansible_facts.processor_vcpus }} vCPU.

    - name: Verifica spazio disco root
      ansible.builtin.assert:
        that:
          - (ansible_facts.mounts | selectattr('mount', 'equalto', '/') | first)['size_available'] / 1073741824 | int >= min_disk_space_gb
        fail_msg: >-
          Spazio disco insufficiente in root: {{ (ansible_facts.mounts | selectattr('mount', 'equalto', '/') | first)['size_available'] / 1073741824 | round(1) }} GB disponibili. Minimo richiesto: {{ min_disk_space_gb }} GB.
        success_msg: >-
          Spazio disco disponibile: {{ (ansible_facts.mounts | selectattr('mount', 'equalto', '/') | first)['size_available'] / 1073741824 | round(1) }} GB.

    - name: Verifica DNS
      ansible.builtin.command: getent hosts google.com
      register: dns_check
      changed_when: false
      failed_when: false

    - name: Mostra stato DNS
      ansible.builtin.debug:
        msg: "DNS: OK"
      when: dns_check.rc == 0

    - name: Verifica connettività esterna
      ansible.builtin.uri:
        url: "https://www.google.com"
        method: HEAD
        status_code: [200, 301, 302]
        timeout: 5
      register: external_connectivity
      changed_when: false
      failed_when: false
      ignore_errors: true

    - name: Mostra stato connettività
      ansible.builtin.debug:
        msg: "Connettività esterna: OK"
      when: external_connectivity.status is defined and external_connectivity.status in [200, 301, 302]

    - name: Verifica tipo ambiente
      ansible.builtin.debug:
        msg: >-
          Ambiente: {{ environment_type | upper }}
          Virtualizzazione: {{ ansible_facts.virtualization_type | default('N/A') }}
          Role: {{ ansible_facts.virtualization_role | default('host') }}

    - name: Verifica errori del kernel
      ansible.builtin.command: dmesg | tail -20 | grep -i error || echo "no_errors"
      register: kernel_errors
      changed_when: false
      failed_when: false

    - name: Mostra stato errori kernel
      ansible.builtin.debug:
        msg: "Kernel errors: {{ 'NONE' if kernel_errors.stdout == 'no_errors' else 'PRESENT' }}"

    - name: Riepilogo finale
      ansible.builtin.debug:
        msg:
          - "================================================================================"
          - "                              HEALTH CHECK REPORT"
          - "================================================================================"
          - "Host: {{ ansible_facts.hostname }} ({{ inventory_hostname }})"
          - "Utente esecuzione: {{ current_user }} (UID: {{ current_uid }})"
          - "Sistema: {{ ansible_facts.distribution }} {{ ansible_facts.distribution_version }}"
          - "Kernel: {{ ansible_facts.kernel }} ({{ ansible_facts.architecture }})"
          - "Ambiente: {{ environment_type | upper }}"
          - "CPU: {{ ansible_facts.processor_vcpus }} vCPU"
          - "RAM: {{ (ansible_facts.memtotal_mb | int / 1024) | round(1) }} GB"
          - "Disco root libero: {{ (ansible_facts.mounts | selectattr('mount', 'equalto', '/') | first)['size_available'] / 1073741824 | round(1) }} GB"
          - "SSH: attivo/se presente"
          - "Python: disponibile"
          - "================================================================================"
          - "STATUS: OK"
          - "================================================================================"

    - name: Salva report JSON
      ansible.builtin.copy:
        content: "{{ {
          'host': inventory_hostname,
          'user': current_user,
          'uid': current_uid,
          'os': ansible_facts.distribution ~ ' ' ~ ansible_facts.distribution_version,
          'kernel': ansible_facts.kernel,
          'architecture': ansible_facts.architecture,
          'environment': environment_type,
          'cpu_vcpu': ansible_facts.processor_vcpus,
          'ram_gb': (ansible_facts.memtotal_mb | int / 1024) | round(1),
          'disk_free_gb': (ansible_facts.mounts | selectattr('mount', 'equalto', '/') | first)['size_available'] / 1073741824 | round(1),
          'status': 'OK'
        } | to_nice_json }}"
        dest: "{{ report_dir }}/check-{{ inventory_hostname }}.json"
        mode: "0644"
      failed_when: false
